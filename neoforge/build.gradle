architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven {
        url "https://maven.neoforged.net/releases/"
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge("net.neoforged:neoforge:${neoforge_version}")

    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }

    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    localRuntime("maven.modrinth:jade:${jade_version}+neoforge") { transitive = false }

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

loom {
    runs {
        data {
            serverData()
            programArgs "--all", "--mod", "${mod_id}"
            programArgs "--output", project(':common').file("src/generated").absolutePath // Outputs to common project
            programArgs "--existing", project(':common').file("src/main/resources").absolutePath // Makes datagen see resources from common folder
        }
    }
}

shadowJar {
    exclude 'architectury.common.json'
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
