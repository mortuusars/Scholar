architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    developmentFabric.extendsFrom common
}

loom {
    var hotswapVmArgs = [
            "-Dfabric.systemLibraries=${System.getProperty("java.home")}/lib/hotswap/hotswap-agent.jar".toString(),
            "-XX:HotswapAgent=fatjar"
    ]

    runs.configureEach {
        vmArgs hotswapVmArgs
    }
}

dependencies {
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    api("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")

    localRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    localRuntime("maven.modrinth:jade:${jade_version}+fabric") { transitive = false }

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
