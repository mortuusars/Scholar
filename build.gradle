plugins {
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id "dev.architectury.loom-no-remap" version "1.14-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.4.+" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.0.0"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = project.mod_maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'com.gradleup.shadow'

    base {
        archivesName = "$rootProject.archives_name-$project.name-${rootProject.minecraft_version}"
    }

    repositories {
        var path = System.getenv("MAVEN_LOCAL")
        if (path != null) {
            maven {
                name = 'mortuusarsLocal'
                url = uri(path + "/maven")
            }
        }

        maven {
            name = "Mortuusars Github Maven"
            url = "https://raw.githubusercontent.com/mortuusars/resources/main/maven/"
        }

        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }

        maven {
            url 'https://www.cursemaven.com'
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }

        // JEI
        maven {
            name = 'tterrag maven'
            url = 'https://maven.tterrag.com/'
        }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        maven {
            url "https://maven.latvian.dev/releases"
            content {
                includeGroup "dev.latvian.mods"
                includeGroup "dev.latvian.apps"
            }
        }
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup "com.github.rtyley"
            }
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    configurations {
        common
        shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common

        apiElements {
            outgoing.artifacts.clear()
            outgoing.artifact(shadowJar)
        }
        runtimeElements {
            outgoing.artifacts.clear()
            outgoing.artifact(shadowJar)
        }
    }

    loom {
        silentMojangMappingsLicense()
        accessWidenerPath.set(project(":common").loom.accessWidenerPath)

        runs {
            client {
                programArgs "--username", "Dev"
                vmArgs '-XX:+AllowEnhancedClassRedefinition', '-XX:HotswapAgent=fatjar'
            }

            register("client2") {
                inherit(getByName("client"))

                name("Second Client")
                programArgs("--username", "AnotherDev")

                client()
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }

    jar {
        archiveClassifier = "raw"
    }

    // https://gist.github.com/shedaniel/18d4eebf940e9c3296e87d994ebb2838
    shadowJar {
        dependsOn(jar)
        mainSpec.sourcePaths.clear()       // Remove default source set inclusion
        from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

        configurations = [project.configurations.shadowCommon]
        archiveClassifier = null           // shadowJar becomes the main artifact
    }

    processResources {
        var expandProps = [
                minecraft_version                     : minecraft_version,
                minecraft_version_range               : minecraft_version_range,
                neoforge_version                      : neoforge_version,
                neoforge_version_range                : neoforge_version_range,
                neoforge_loader_version_range         : neoforge_loader_version_range,
                fabric_supported_minecraft_versions   : fabric_supported_minecraft_versions,
                forge_config_api_port_version         : forge_config_api_port_version,
                required_forge_config_api_port_version: required_forge_config_api_port_version,
                mod_id                                : mod_id,
                mod_name                              : mod_name,
                mod_version                           : mod_version,
                mod_authors                           : mod_authors,
                mod_description                       : mod_description,
                mod_issues                            : mod_issues,
                mod_page                              : mod_page,
                mod_github                            : mod_github,
                mod_license                           : mod_license,
                mod_maven_group                       : mod_maven_group
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', "*.mixins.json"]) {
            expand expandProps
        }
        inputs.properties(expandProps)

        from(rootProject.file("common/src/main/resources")) {
            include("resourcepacks/**")
            duplicatesStrategy = DuplicatesStrategy.WARN
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = "${mod_id}-${minecraft_version}-${project.name}"
                version = "${mod_version}"
                from components.java
            }
        }

        repositories {
            var localPath = System.getenv("MAVEN_LOCAL")
            if (localPath != null) {
                maven {
                    name = 'mortuusarsLocal'
                    url = uri(localPath + "/maven")
                }
            }

            var resourcesPath = System.getenv("MAVEN_GITHUB_RESOURCES")
            if (resourcesPath != null) {
                maven {
                    name = 'mortuusarsGithubResources'
                    url = uri(resourcesPath + "/maven")
                }
            }
        }
    }
}

/**
 * Gets the first part (topmost) of a changelog file.
 * Expects it to be in the following format:
 * [
 *  ## latest version
 *      changes
 *
 *  ## older version
 *      changes
 * ]
 * Will return an empty string if failed.
 */
def getLatestVersionChangelog() {
    def changelogFileName = 'CHANGELOG.md'
    def changelogFile = file(changelogFileName)
    if (changelogFile.exists()) {
        def changelogContent = changelogFile.text
        def changelogParts = changelogContent.split(/(?m)^##\s/)

        if (changelogParts.size() > 1) {
            return "## " + changelogParts[1].trim() // First part will always be second in the list
        } else {
            println("[WARN] Changelog does not contain any versions.")
            return ""
        }
    } else {
        println("[WARN] Changelog file <${changelogFileName}> does not exist.")
        return ""
    }
}

project.ext.changelog = getLatestVersionChangelog()

task printLatestVersionChangelog {
    doLast {
        println project.changelog
    }
}

publishMods {
    changelog = project.ext.changelog
    type = STABLE

    def forceDryRun = false
    dryRun = forceDryRun || providers.environmentVariable("CURSEFORGE_TOKEN").getOrNull() == null || providers.environmentVariable("MODRINTH_TOKEN").getOrNull() == null

    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = mod_curseforge_project_id
        for (final def ver in supported_minecraft_versions.split(",")) {
            minecraftVersions.add(ver)
        }
        javaVersions.add(JavaVersion.VERSION_25)
        clientRequired = true
        serverRequired = true
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = mod_modrinth_project_id
        for (final def ver in supported_minecraft_versions.split(",")) {
            minecraftVersions.add(ver)
        }
    }

    curseforge("curseforgeNeoForge") {
        from cfOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        displayName = "${mod_name} - NeoForge ${minecraft_version} - ${mod_version}"
    }

    curseforge("curseforgeFabric") {
        from cfOptions
        file project(":fabric")
        modLoaders.add("fabric")
        displayName = "${mod_name} - Fabric ${minecraft_version} - ${mod_version}"
        requires("fabric-api")
        requires("forge-config-api-port")
    }

    modrinth("modrinthNeoForge") {
        from mrOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        displayName = "${mod_name} - ${mod_version}"
    }

    modrinth("modrinthFabric") {
        from mrOptions
        file project(":fabric")
        modLoaders.add("fabric")
        displayName = "${mod_name} - ${mod_version}"
        requires("fabric-api")
        requires("forge-config-api-port")
    }
}